<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Code Analyst</title>
    <style>
        /* SAME STYLES AS BEFORE - Dark Mode & Clean UI */
        :root { --bg-color: #0d1117; --chat-bg: #161b22; --primary: #238636; --text-color: #c9d1d9; --user-msg-bg: #21262d; --ai-msg-bg: #1f242c; --border-color: #30363d; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--chat-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .header-title { font-weight: bold; font-size: 1.1rem; }
        .reset-btn { background-color: #21262d; border: 1px solid var(--border-color); color: #ff6b6b; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .user-message { align-self: flex-end; background-color: var(--user-msg-bg); color: white; }
        .ai-message { align-self: flex-start; background-color: var(--ai-msg-bg); font-family: 'Courier New', monospace; white-space: pre-wrap; }
        #input-area { background-color: var(--chat-bg); padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-color); }
        .file-upload-btn { background-color: #21262d; border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; color: #8b949e; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--border-color); background-color: #0d1117; color: white; font-size: 16px; outline: none; }
        .send-btn { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .loader { display: none; align-self: flex-start; background-color: var(--ai-msg-bg); padding: 10px 15px; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">⚡ AI Code Analyst</div>
        <button class="reset-btn" onclick="resetKey()">Reset Key</button>
    </header>

    <div id="chat-container">
        <div class="message ai-message">System Online. Upload a file or paste code to begin.</div>
    </div>
    <div class="loader" id="loader">...</div>

    <div id="input-area">
        <label class="file-upload-btn">+<input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)"></label>
        <input type="text" id="user-input" placeholder="Type instructions..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const loader = document.getElementById('loader');
        let uploadedFileContent = "", uploadedFileName = "";

        // 1. SAFE KEY LOGIC: Checks LocalStorage or asks user
        function getApiKey() {
            let key = localStorage.getItem("gemini_key");
            if (!key || !key.startsWith("AQ")) { // Basic check for your key format
                key = prompt("Paste your Gemini API Key (starts with AQ...):");
                if (key) {
                    localStorage.setItem("gemini_key", key.trim());
                    return key.trim();
                }
                return null;
            }
            return key;
        }

        function resetKey() {
            localStorage.removeItem("gemini_key");
            alert("Key removed. You will be asked to enter it again.");
            location.reload();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            uploadedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFileContent = e.target.result;
                addMessage(`📄 File Loaded: ${uploadedFileName}`, 'user-message');
            };
            reader.readAsText(file);
        }

        async function sendMessage() {
            let text = userInput.value.trim();
            if (!text && !uploadedFileContent) return;

            // Get Key securely
            const apiKey = getApiKey();
            if (!apiKey) { alert("API Key required!"); return; }

            let finalPrompt = text;
            if (uploadedFileContent) {
                finalPrompt = `[Analyzing File: ${uploadedFileName}]\nUSER: ${text}\n--- CODE ---\n${uploadedFileContent}`;
                addMessage(text || `Analyze ${uploadedFileName}`, 'user-message');
                uploadedFileContent = ""; uploadedFileName = "";
            } else {
                addMessage(text, 'user-message');
            }

            userInput.value = '';
            loader.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const url = `https://googleapis.com{apiKey}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: "You are an expert Android Developer." }] },
                        generationConfig: { temperature: 0.2 }
                    })
                });
                const data = await response.json();
                loader.style.display = 'none';
                
                if (data.error) throw new Error(data.error.message);
                if (data.candidates) addMessage(data.candidates[0].content.parts[0].text, 'ai-message');

            } catch (error) {
                loader.style.display = 'none';
                addMessage(`⚠️ Error: ${error.message}`, 'ai-message');
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.classList.add('message', type);
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
